quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.enabled=false
%dev.quarkus.datasource.dev-ui.allow-sql=true
%test.quarkus.datasource.devservices.enabled=false
quarkus.test.continuous-testing=enabled
%test.quarkus.scheduler.enabled=false
# SmallRye JWT Configuration for Firebase
mp.jwt.verify.publickey.location=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
mp.jwt.verify.issuer=https://securetoken.google.com/cleepy-aa466
mp.jwt.verify.audiences=cleepy-aa466
quarkus.smallrye-jwt.enabled=true
# Optional: Token lifetime check (in seconds)
mp.jwt.verify.token.age=3600
# API Path Configuration
quarkus.rest.path=/api
# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Type,Authorization
quarkus.http.cors.access-control-max-age=PT24H
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.limits.max-body-size=2048M
# AI Clipper Python Service (REST Client)
quarkus.rest-client.ai-clipper.url=https://vincenthartanto--ai-clipper-http-api.modal.run
quarkus.rest-client.ai-clipper.connect-timeout=5000
quarkus.rest-client.ai-clipper.read-timeout=45000
# %dev.quarkus.rest-client.ai-clipper.url=http://localhost:8000

 %dev.quarkus.rest-client.ai-clipper.url=https://vincenthartanto--ai-clipper-http-api.modal.run
%dev.quarkus.rest-client.ai-clipper.connect-timeout=5000
%dev.quarkus.rest-client.ai-clipper.read-timeout=45000

# Fix Hibernate post-boot validation NPE
quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.enabled=false

# Google Cloud Storage Settings
quarkus.google.cloud.project-id=cleepy
app.gcs.bucket-name=${GCP_BUCKET_NAME:cleepy-clip-storage}
%test.app.gcs.bucket-name=test-bucket
# Set path to the JSON key if running locally:
quarkus.google.cloud.credentials.type=service-account
quarkus.google.cloud.credentials.location=file:///Users/vincenthartanto/Documents/2026 commercial project/cleepy-ai/cleepy-be/gcp-credentials.json
# Note: In production you can omit credentials.location to use Application Default Credentials.

# Social publishing
social.oauth.backend-base-url=http://localhost:8080/api
social.oauth.frontend-base-url=http://localhost:3000
social.media.base-url=http://localhost:8080/api
project.media.base-path=/api
social.oauth.state-secret=change-me-in-production
social.encryption-key=change-it
social.google.client-id=change-it
social.google.client-secret=change-it
social.tiktok.client-key=change-it
social.tiktok.client-secret=change-it